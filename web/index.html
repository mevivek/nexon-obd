<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07070b">

<!-- Home-screen install. The manifest and the icon are served from flash, not from
     this bundle - see firmware/Obdurate/pwa.h for why, and for what a plain-HTTP
     origin rules out (a service worker, and therefore Chrome's install prompt).

     The apple-* tags are what actually does the job on iOS, which ignores the
     manifest for Add to Home Screen and needs neither HTTPS nor a service worker.
     black-translucent puts the page under the status bar, which is what
     viewport-fit=cover above is already set up for. -->
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon.svg">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Obdurate">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<title>Obdurate</title>
</head>
<body>
<div id="app"></div>
<script type="module" src="/src/main.jsx"></script>
</body>
</html>
